<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Coffee Cup Character for Stay Caffeinated -->

  <!-- MUG BODY - rounded trapezoid shape -->
  <g id="mug-body">
    <path d="M 130 140
             L 110 380
             Q 110 420, 150 420
             L 350 420
             Q 390 420, 370 380
             L 350 140
             Z"
          fill="#F5F0E8" stroke="#D4C9B8" stroke-width="3" rx="20"/>
  </g>

  <!-- COFFEE LIQUID - inside the mug, will be animated up/down -->
  <g id="coffee-liquid">
    <!-- Coffee surface with slight wave -->
    <path d="M 120 280
             Q 180 270, 240 280
             Q 300 290, 360 280
             L 355 380
             Q 355 410, 340 410
             L 160 410
             Q 145 410, 140 380
             Z"
          fill="#6F4E37"/>
    <!-- Coffee highlight/shine -->
    <ellipse cx="240" cy="282" rx="80" ry="8" fill="#8B6B4A" opacity="0.5"/>
  </g>

  <!-- MUG HANDLE - C-shape on the right -->
  <g id="handle">
    <path d="M 365 200
             Q 440 200, 440 280
             Q 440 360, 365 340"
          fill="none" stroke="#D4C9B8" stroke-width="22" stroke-linecap="round"/>
    <path d="M 365 210
             Q 428 210, 428 280
             Q 428 350, 365 335"
          fill="none" stroke="#F5F0E8" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- MUG RIM - top edge highlight -->
  <g id="rim">
    <path d="M 125 140 L 355 140"
          stroke="#E8E0D4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- FACE -->
  <g id="face">
    <!-- Left eye -->
    <g id="left-eye">
      <ellipse cx="195" cy="240" rx="18" ry="20" fill="#3A3A3A"/>
      <!-- Eye shine -->
      <ellipse cx="202" cy="232" rx="6" ry="7" fill="white" opacity="0.8"/>
    </g>

    <!-- Right eye -->
    <g id="right-eye">
      <ellipse cx="295" cy="240" rx="18" ry="20" fill="#3A3A3A"/>
      <!-- Eye shine -->
      <ellipse cx="302" cy="232" rx="6" ry="7" fill="white" opacity="0.8"/>
    </g>

    <!-- Mouth - happy smile -->
    <g id="mouth">
      <path d="M 210 300 Q 245 340, 280 300"
            fill="none" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Cheek blushes -->
    <g id="cheeks">
      <ellipse cx="170" cy="290" rx="20" ry="12" fill="#FFB5B5" opacity="0.4"/>
      <ellipse cx="320" cy="290" rx="20" ry="12" fill="#FFB5B5" opacity="0.4"/>
    </g>
  </g>

  <!-- STEAM WISPS - will be animated -->
  <g id="steam">
    <path id="steam1" d="M 200 120 Q 190 90, 200 60 Q 210 30, 200 10"
          fill="none" stroke="#CCCCCC" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path id="steam2" d="M 245 110 Q 235 75, 245 45 Q 255 15, 245 -10"
          fill="none" stroke="#CCCCCC" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path id="steam3" d="M 290 120 Q 300 85, 290 55 Q 280 25, 290 0"
          fill="none" stroke="#CCCCCC" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- ZZZ - sleepy state overlay -->
  <g id="zzz" opacity="0">
    <text x="320" y="100" font-family="Arial" font-size="32" font-weight="bold" fill="#8888CC">Z</text>
    <text x="345" y="70" font-family="Arial" font-size="24" font-weight="bold" fill="#8888CC" opacity="0.7">z</text>
    <text x="365" y="50" font-family="Arial" font-size="18" font-weight="bold" fill="#8888CC" opacity="0.5">z</text>
  </g>

  <!-- LIGHTNING - wired state overlay -->
  <g id="lightning" opacity="0">
    <path d="M 160 80 L 145 115 L 165 110 L 148 145"
          fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <path d="M 330 70 L 345 105 L 325 100 L 342 135"
          fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
